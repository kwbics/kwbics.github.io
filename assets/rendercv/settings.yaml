# Paths are relative to the exported input at output/cv/rendercv.yaml.
# Pass design and locale explicitly via --design and --locale-catalog.
# https://docs.rendercv.com/user_guide/yaml_input_structure/settings/
settings:
  render_command:
    output_folder: .
    typst_path: OUTPUT_FOLDER/cv.typ
    pdf_path: OUTPUT_FOLDER/cv.pdf
    dont_generate_markdown: true
    dont_generate_html: true
    dont_generate_typst: false # required for PDF output
    dont_generate_pdf: false
    dont_generate_png: true
  bold_keywords: []
