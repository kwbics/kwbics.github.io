name: Visual regression checks

on:
  push:
    branches: [main, master, v1.0-dev]
    paths:
      - "_config.yml"
      - "_data/**"
      - "_pages/**"
      - "_posts/**"
      - "_news/**"
      - "_projects/**"
      - "_teachings/**"
      - "_books/**"
      - "_bibliography/**"
      - "_sass/**"
      - "_includes/**"
      - "_layouts/**"
      - "_plugins/**"
      - "assets/**"
      - "test/**"
      - "bin/**"
      - "package.json"
      - "package-lock.json"
      - ".prettierignore"
      - ".prettierrc*"
      - "Gemfile"
      - "Gemfile.lock"
      - ".github/workflows/**"
      - "SITE_MAINTENANCE.md"
  pull_request:
    branches: [main, master, v1.0-dev]
    paths:
      - "_config.yml"
      - "_data/**"
      - "_pages/**"
      - "_posts/**"
      - "_news/**"
      - "_projects/**"
      - "_teachings/**"
      - "_books/**"
      - "_bibliography/**"
      - "_sass/**"
      - "_includes/**"
      - "_layouts/**"
      - "_plugins/**"
      - "assets/**"
      - "test/**"
      - "bin/**"
      - "package.json"
      - "package-lock.json"
      - ".prettierignore"
      - ".prettierrc*"
      - "Gemfile"
      - "Gemfile.lock"
      - ".github/workflows/**"
      - "SITE_MAINTENANCE.md"

permissions:
  contents: read

jobs:
  visual-regression:
    # Responsive/navigation checks of this site; no upstream tag or sample blogs.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TMPDIR: ${{ github.workspace }}/output/site/tmp
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare worktree scratch
        run: mkdir -p "$TMPDIR"
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install locked JavaScript dependencies
        run: npm ci
      - name: Install image build runtime
        run: sudo apt-get update && sudo apt-get install -y imagemagick
      - name: Validate and build actual site
        run: npm run check:site
      - name: Install CI browser
        run: npx --no-install playwright install --with-deps chromium
      - name: Check responsive site behavior
        run: npm run test:visual
      - name: Upload failure screenshots, traces, and report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: site-responsive-failure
          path: |
            output/site/test-results/
            output/site/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
