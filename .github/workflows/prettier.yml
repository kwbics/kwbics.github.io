name: Prettier code formatter

on:
  push:
    branches: [main, master]
    paths:
      - "_config.yml"
      - "_data/**"
      - "_pages/**"
      - "_posts/**"
      - "_news/**"
      - "_projects/**"
      - "_teachings/**"
      - "_books/**"
      - "_bibliography/**"
      - "_sass/**"
      - "_includes/**"
      - "_layouts/**"
      - "_plugins/**"
      - "assets/**"
      - "test/**"
      - "bin/**"
      - "package.json"
      - "package-lock.json"
      - ".prettierignore"
      - ".prettierrc*"
      - "Gemfile"
      - "Gemfile.lock"
      - ".github/workflows/**"
      - "SITE_MAINTENANCE.md"
  pull_request:
    branches: [main, master]
    paths:
      - "_config.yml"
      - "_data/**"
      - "_pages/**"
      - "_posts/**"
      - "_news/**"
      - "_projects/**"
      - "_teachings/**"
      - "_books/**"
      - "_bibliography/**"
      - "_sass/**"
      - "_includes/**"
      - "_layouts/**"
      - "_plugins/**"
      - "assets/**"
      - "test/**"
      - "bin/**"
      - "package.json"
      - "package-lock.json"
      - ".prettierignore"
      - ".prettierrc*"
      - "Gemfile"
      - "Gemfile.lock"
      - ".github/workflows/**"
      - "SITE_MAINTENANCE.md"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check source formatting
        # Failure stays visible; this job never rewrites source or installs latest.
        run: npm run lint:prettier
