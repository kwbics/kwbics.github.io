name: Render a CV

on:
  push:
    branches:
      - main
      - master
    paths:
      - "_data/cv.yml"
      - "bin/export_cv.py"
      - "test/test_export_cv.py"
      - "requirements-cv.txt"
      - "assets/rendercv/**"
      - ".github/workflows/render-cv.yml"
  pull_request:
    paths:
      - "_data/cv.yml"
      - "bin/export_cv.py"
      - "test/test_export_cv.py"
      - "requirements-cv.txt"
      - "assets/rendercv/**"
      - ".github/workflows/render-cv.yml"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rendercv:
    name: RenderCV
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TMPDIR: ${{ github.workspace }}/design/cv-ci/tmp
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Prepare temporary directory
        run: mkdir -p "$TMPDIR"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CV dependencies
        run: |
          python -m venv design/cv-ci/.venv
          design/cv-ci/.venv/bin/python -m pip --isolated install --no-cache-dir --index-url https://pypi.org/simple -r requirements-cv.txt
          echo "$GITHUB_WORKSPACE/design/cv-ci/.venv/bin" >> "$GITHUB_PATH"
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends poppler-utils
      - name: Test CV export and future-update renders
        env:
          CV_RENDER_TESTS: "1"
        run: python -m unittest discover -s test -p test_export_cv.py -v
      - name: Export website CV
        run: python bin/export_cv.py --input _data/cv.yml --output output/cv/rendercv.yaml
      - name: Render PDF
        run: |
          rendercv render output/cv/rendercv.yaml \
            --settings "$GITHUB_WORKSPACE/assets/rendercv/settings.yaml" \
            --design "$GITHUB_WORKSPACE/assets/rendercv/design.yaml" \
            --locale-catalog "$GITHUB_WORKSPACE/assets/rendercv/locale.yaml"
      - name: Verify readable PDF and unchanged CV source
        env:
          RENDERCV_PDF: output/cv/cv.pdf
          RENDERCV_YAML: output/cv/rendercv.yaml
        run: |
          python -m unittest discover -s test -p test_export_cv.py -k test_rendered_pdf -v
          git diff --exit-code -- _data/cv.yml
      - name: Upload CV PDF
        uses: actions/upload-artifact@v4
        with:
          name: curriculum-vitae
          path: output/cv/cv.pdf
          if-no-files-found: error
