name: Deploy site

on:
  push:
    branches: [main, master]
    paths:
      - "_config.yml"
      - "_data/**"
      - "_pages/**"
      - "_posts/**"
      - "_news/**"
      - "_projects/**"
      - "_teachings/**"
      - "_books/**"
      - "_bibliography/**"
      - "_sass/**"
      - "_includes/**"
      - "_layouts/**"
      - "_plugins/**"
      - "assets/**"
      - "test/**"
      - "bin/**"
      - "package.json"
      - "package-lock.json"
      - ".prettierignore"
      - ".prettierrc*"
      - "Gemfile"
      - "Gemfile.lock"
      - ".github/workflows/**"
      - "SITE_MAINTENANCE.md"
  pull_request:
    branches: [main, master]
    paths:
      - "_config.yml"
      - "_data/**"
      - "_pages/**"
      - "_posts/**"
      - "_news/**"
      - "_projects/**"
      - "_teachings/**"
      - "_books/**"
      - "_bibliography/**"
      - "_sass/**"
      - "_includes/**"
      - "_layouts/**"
      - "_plugins/**"
      - "assets/**"
      - "test/**"
      - "bin/**"
      - "package.json"
      - "package-lock.json"
      - ".prettierignore"
      - ".prettierrc*"
      - "Gemfile"
      - "Gemfile.lock"
      - ".github/workflows/**"
      - "SITE_MAINTENANCE.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TMPDIR: ${{ github.workspace }}/output/site/tmp
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare worktree scratch
        run: mkdir -p "$TMPDIR"
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install locked JavaScript dependencies
        run: npm ci
      - name: Install image build runtime
        run: sudo apt-get update && sudo apt-get install -y imagemagick
      - name: Validate and build production site
        # One build, checked before the existing gh-pages publishing action.
        # No source mutation, optional PDF rendering, or unchecked CSS postprocessing.
        run: npm run check:site
      - name: Deploy
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: _site
