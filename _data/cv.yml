cv:
  name: Joonsung Bae
  label: Associate Professor; Co-founder and CIO at XO Semiconductor
  email: baej@kangwon.ac.kr
  location: Chuncheon, Republic of Korea
  image: "" # al_folio_cv (rendercv) layout renders no profile photo; home page shows it instead
  summary: >
    Associate Professor of Electrical and Electronics Engineering at Kangwon National University,
    directing Bae's Integrated Circuits and Systems Lab (BICS), and co-founder and CIO of
    XO Semiconductor (xosemi). Research on analog, RF, and mixed-signal integrated circuits and
    system architectures for neural and biomedical interfaces, ultra-low-power wireless links for
    medical devices, AI-enabled sensor systems, medical imaging, and high-speed interfaces with
    FPGA-based data capture. Has served on the Technical Program Committees of IEEE ISSCC and
    IEEE A-SSCC.

  social_networks:
    - network: Google Scholar
      username: DvZKLt8AAAAJ
    - network: ORCID
      username: 0000-0002-6375-2248

  address:
    city: Chuncheon
    region: Gangwon
    countryCode: KR

  sections:
    Research Interests:
      - label: Integrated circuits
        details: Analog, RF, and mixed-signal CMOS integrated circuits.
      - label: Biomedical and neural interfaces
        details: Biomedical circuits and systems for healthcare IoT; neural interface and brain-computer interface systems.
      - label: Wireless
        details: Ultra-low-power wireless communication for medical devices.
      - label: Sensing and imaging
        details: AI-enabled smart sensor systems and edge computing; X-ray and ultrasound medical imaging systems.
      - label: High-speed interfaces
        details: High-speed interface design and FPGA-based data capture.

    Education:
